name: links

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  link_checker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Build site
      # Mirror the production deployment shape:
      # https://www.claricle.org/postscript-guide/ (baseurl in docs/_config.yml)
      env:
        JEKYLL_ENV: production
      run: bundle exec jekyll build --trace --baseurl /postscript-guide
      working-directory: docs

    - name: Restore lychee cache
      uses: actions/cache@v4
      with:
        path: .lycheecache
        key: cache-lychee-${{ github.sha }}
        restore-keys: cache-lychee-

    - name: Lay out site under its production base path
      # The built site nests under a directory named after the base path so
      # that absolute hrefs (/postscript-guide/...) resolve on the filesystem,
      # exactly as they do on the live site.
      run: |
        if [ ! -d "_site" ]; then
          echo "Error: _site directory not created"
          exit 1
        fi
        echo "Site built successfully"
        mkdir -p .linkcheck
        mv _site .linkcheck/postscript-guide
        ls -la .linkcheck/postscript-guide/ | head
      working-directory: docs

    - name: Link Checker (Built Site)
      uses: lycheeverse/lychee-action@v2
      with:
        # Check the built HTML site for rendered links
        # Absolute local hrefs (/postscript-guide/...) resolve against
        # --root-dir; in-page fragment hrefs resolve against the checked file
        # itself. (--base-url is deliberately not set: it would make lychee
        # resolve fragment-only hrefs against the base instead of the page.)
        args: >-
          --verbose
          --no-progress
          --config lychee.toml
          --root-dir "$(pwd)/.linkcheck"
          '.linkcheck/postscript-guide/**/*.html'
        fail: true
        output: link-check-results.md
        format: markdown
        workingDirectory: docs

    - name: Upload link check results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: link-check-results
        path: |
          docs/link-check-results.md
        retention-days: 30

    - name: Comment PR with results
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let comment = '## 🔗 Link Check Failed\n\n';

          if (fs.existsSync('docs/link-check-results.md')) {
            const results = fs.readFileSync('docs/link-check-results.md', 'utf8');
            comment += '### Built Site Results\n\n' + results + '\n\n';
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
