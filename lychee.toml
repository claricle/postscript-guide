# Lychee Link Checker Configuration
# For PostScript Language Reference Guide
# https://github.com/lycheeverse/lychee

# Cache results to avoid re-checking same URLs
cache = true
max_cache_age = "1d"

# Check both source files and built site
include_verbatim = true

# Note: local files are always checked recursively in modern lychee versions;
# `recursive` and `include_file` are not valid config keys (they make the
# config fail to parse, which broke the link check).

# Excluded paths
exclude = [
  ".git",
  ".github",
  "node_modules",
  "vendor",
  ".bundle",
  ".sass-cache",
  ".jekyll-cache",
  # Adobe serves 403 to non-browser clients for its public PDFs and product
  # pages (bot protection); these links are valid in a real browser.
  "https?://www\\.adobe\\.com/.*",
  # The site's own absolute URLs (canonical, og:url and JSON-LD generated by
  # jekyll-seo-tag) point at production; a PR build always runs before the
  # new pages are deployed, so checking them against the live site 404s.
  # Internal links are checked as file:// paths against the built site.
  "https?://www\\.claricle\\.org/.*"
]

# Link checking behavior
max_redirects = 10
max_retries = 3
timeout = 20

# Accept status codes
accept = [
  "100..=103",  # Informational
  "200..=299",  # Success
  "429"         # Too Many Requests (retry handled by max_retries)
]

# User agent to identify ourselves
user_agent = "lychee/postscript-guide-link-checker"

# Check HTTP, HTTPS, and file:// schemes
scheme = ["https", "http", "file"]

# Handle different link types
include_mail = false  # Don't check mailto: links

# Follow links but don't check their content recursively
max_concurrency = 8

# Verbose output for debugging
verbose = "info"

# Require HTTPS where possible
require_https = false  # Don't enforce

# Check fragment identifiers (anchors)
# include_fragments = true

index_files = ["index.html"]